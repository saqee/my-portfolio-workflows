name: "Reactapp"

on:
  push:
    branches: [main]
    
jobs:
  react-app:
    runs-on: ubuntu-latest
    
    
    steps:
      - uses: action/checkout@4.2.2
      - name: Setup nodejs
        uses: actions/setup-node@4.2.0
        with:
          node-version: 22.x
      - name: Install depen
        uses: npm install
        
      - name: Build angular app
        run: npm run build
