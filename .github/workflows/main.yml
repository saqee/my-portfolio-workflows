name: "Reactapp"

on:
  push:
    branches: [master]
    
jobs:
  react-app:
    runs-on: ubuntu-latest
    
    
    steps:
      - uses: actions/checkout@v6.0.3
      - name: Setup nodejs
        uses: actions/setup-node@4.2.0
        with:
          node-version: 22.x
      - name: Install depen
        run: npm install
        
      - name: Build angular app
        run: npm run build
